<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempTracker</title>
    <link rel="icon" type="image/x-icon" href="rastreo.png"/>
    <link rel="stylesheet" href="./estilos.css">
</head>
<body>
    <div class="contenedor">

        <div class="buscador">
            <input 
                type="text" 
                placeholder="Ingresa una ciudad"
                spellcheck="false"
                autocomplete="false"
                id="input-ciudad" 
            >
            <button onclick="ObtenerClima()">
                <img src="Imagenes/buscar.png" />
            </button>
        </div>

        <div class="clima-info" id="clima-contenedor">
            <p class="clima-texto">Parcialmente nublado</p>
            <img src="Imagenes/Clima-ejemplo.png" class="clima-icono"/>
            <h1 class="temp">22°c</h1>
            <h2 class="ciudad">Huancayo</h2>
            
            <!-- Aquí están los detalles de abajo agrupados -->
            <div class="detalles">
                <div class="col">
                    <!-- LE AGREGUÉ LA CLASEicono-detalle PARA ACHICARLA -->
                    <img src="Imagenes/Humedad.png" class="icono-detalle"/>
                    <div>
                        <p class="humedad">50%</p>
                        <p class="subtitulo">Humedad</p>
                    </div>
                </div>
                <div class="col">
                    <!-- LE AGREGUÉ LA CLASEicono-detalle PARA ACHICARLA -->
                    <img src="Imagenes/viento.png" class="icono-detalle"/>
                    <div>
                        <p class="viento">15 km/h</p>
                        <p class="subtitulo">Viento</p>
                    </div>
                </div>
            </div> <!-- Cierre de detalles -->
        </div> <!-- Cierre de clima-info -->

    </div> <!-- Cierre de contenedor -->

    <script src="./codigo.js"></script>
</body>
</html>
